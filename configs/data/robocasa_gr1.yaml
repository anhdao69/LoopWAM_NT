# RoboCasa-GR1 tabletop: the 24 `gr1_unified.*_GR1ArmsAndWaistFourierHands_1000` folders
# (starVLA mixture `fourier_gr1_unified_1000`), LeRobot v2.0, 20 fps, one 256x256 ego camera,
# 44-D state/action reduced to the 29 controllable dims at the processor's action_state_transforms
# hook (left_arm 0:7, right_arm 22:29, left_hand 7:13, right_hand 29:35, waist 41:44; legs/neck dropped).
#
# Paths default to ./data/...; on the H100 cluster set
#   ROBOCASA_GR1_ROOT=/mnt/data/vmo-ai-task/anhdh35/datasets/robocasa_gr1
#   ROBOCASA_GR1_STATS=<run>/shared/data/dataset_stats_29d.json   (scripts/gr1_prepare_data.py)
#   ROBOCASA_GR1_TEXT_CACHE=/mnt/data/vmo-ai-task/anhdh35/datasets/LoopWAM_NT/text_embeds_cache/robocasa_gr1
# The LoopWAM v0 trainer (scripts/train_loopwam_gr1.py) uses the same protocol through
# fastwam.datasets.robocasa_gr1.GR1Windows plus the frozen-VAE latent cache.
train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PnPBottleToCabinetClose_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PnPCanToDrawerClose_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PnPCupToDrawerClose_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PnPMilkToMicrowaveClose_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PnPPotatoToMicrowaveClose_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PnPWineToCabinetClose_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromCuttingboardToBasketSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromCuttingboardToCardboardboxSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromCuttingboardToPanSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromCuttingboardToPotSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromCuttingboardToTieredbasketSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromPlacematToBasketSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromPlacematToBowlSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromPlacematToPlateSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromPlacematToTieredshelfSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromPlateToBowlSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromPlateToCardboardboxSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromPlateToPanSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromPlateToPlateSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromTrayToCardboardboxSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromTrayToPlateSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromTrayToPotSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromTrayToTieredbasketSplitA_GR1ArmsAndWaistFourierHands_1000
    - ${oc.env:ROBOCASA_GR1_ROOT,./data/robocasa_gr1}/gr1_unified.PosttrainPnPNovelFromTrayToTieredshelfSplitA_GR1ArmsAndWaistFourierHands_1000
  shape_meta:
    images:
      - key: ego_view
        raw_shape: [3, 256, 256]
        shape: [3, 256, 256]
    action:
      - key: default
        raw_shape: 44 # before transform
        shape: 29 # after GR1ArmsWaistSelect
    state:
      - key: default
        raw_shape: 44 # before transform
        shape: 29 # after GR1ArmsWaistSelect
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 actions, 9 video frames
  video_size: [256, 256] # native resolution, no resize
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  pretrained_norm_stats: ${oc.env:ROBOCASA_GR1_STATS,./data/robocasa_gr1/dataset_stats_29d.json}
  skip_padding_as_possible: false
  concat_multi_camera: null # single camera
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 1
    action_output_dim: 29
    proprio_output_dim: 29

    action_state_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.gr1.GR1ArmsWaistSelect
        keys: [default]
    use_stepwise_action_norm: False
    # min/max -> [-1, 1]; SingleFieldLinearNormalizer guards near-constant dims
    # (max - min < range_tol = 1e-4 maps to x - min instead of dividing by ~0).
    norm_default_mode: "min/max"
    norm_exception_mode: null
    delta_action_dim_mask: null # absolute actions

    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
  text_embedding_cache_dir: ${oc.env:ROBOCASA_GR1_TEXT_CACHE,./data/text_embeds_cache/robocasa_gr1}
  context_len: 128
